[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qualitative-analysis"
version = "0.1.0"
description = "A modular suite for qualitative data analysis using LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Project Team", email = "team@example.com"}
]
dependencies = [
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "litellm>=1.0.0",  # For broad LLM support
    "jinja2>=3.0.0",   # For prompt templates
    "httpx>=0.27.0",   # For Ollama HTTP API calls
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
qualitative-analysis = "qualitative_analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qualitative_analysis"]
include = ["src/qualitative_analysis/figurative/prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
