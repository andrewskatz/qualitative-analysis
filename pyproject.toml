[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qualitative-analysis"
version = "0.2.0"
description = "A modular Python toolkit for qualitative data analysis using LLMs (figurative, relationships, entity, decisions pathways)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Andrew Katz", email = "akatz@tabbiresearch.com"}
]
dependencies = [
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "litellm>=1.0.0",  # For broad LLM support
    "jinja2>=3.0.0",   # For prompt templates
    "httpx>=0.27.0",   # For Ollama HTTP API calls
    "tiktoken>=0.7.0", # Token-based chunking
    "sentence-transformers>=3.0.0",  # Domain normalization embeddings
    "scikit-learn>=1.5.0",            # Clustering
    "numpy>=1.24.0",                  # Array operations
    "pandas>=2.0.0",                  # Used by entity/agreement.py and entity/bayesian.py
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
viz = [
    "networkx>=3.0.0",
    "matplotlib>=3.5.0",
    "umap-learn>=0.5.0",
    "hdbscan>=0.8.0",
    "adjustText>=1.0.0",
    "python-ternary>=1.0.8",  # Ternary plots for entity scoring visualization
]
bayes = [
    "pymc>=5.21",
    "arviz>=0.20",
    "nutpie>=0.13",
]
mlx = [
    "mlx-vlm>=0.3.12",
    "torchvision",
]

[project.scripts]
qa = "qualitative_analysis.unified_cli:main"
qualitative-analysis = "qualitative_analysis.cli:main"
qualitative-relationships = "qualitative_analysis.relationships_cli:main"
qualitative-domains = "qualitative_analysis.figurative.domains_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qualitative_analysis"]
include = [
    "src/qualitative_analysis/figurative/prompts/*.txt",
    "src/qualitative_analysis/figurative/domains/prompts/*.txt",
    "src/qualitative_analysis/relationships/prompts/*.txt",
    "src/qualitative_analysis/entity/prompts/*.txt",
    "src/qualitative_analysis/decisions/prompts/*.txt",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
